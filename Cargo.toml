[package]
name = "dolbotally"
version = "0.4.1"
authors = ["EnmakaiDev"]
edition = "2024"
license = "GPL-3.0"
description = "Frankly simplish multi-tally counter."
repository = "https://codeberg.org/enmkdev/dolbotally"
homepage = "https://enmkdev.neocities.org/projects/dolbotally/"
readme = "README.md"
keywords = ["tui", "tally", "counter"]
categories = ["command-line-interface", "command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
enum-iterator = "2.3.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["serde_derive"] }
toml = "1.1.5"
tui-big-text = "0.8.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
